<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-label="청년가구와 전체가구의 자산 지표 비교">
  <style>
    .ko { font-family: 'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #1E3A5F; }
    .panel-title { font-size: 19px; font-weight: 700; fill: #1E3A5F; }
    .axis { font-size: 15px; fill: #6B7684; }
    .value { font-size: 20px; font-weight: 700; fill: #1E3A5F; }
    .value-hi { font-size: 20px; font-weight: 700; fill: #C4501F; }
    .note { font-size: 14px; fill: #6B7684; }
    .cap { font-size: 14px; fill: #6B7684; }
    .legend { font-size: 15px; fill: #444C56; }
  </style>

  <rect x="0" y="0" width="1200" height="470" fill="#FFFFFF"/>

  <text class="ko title" x="40" y="46">청년가구(39세 이하) vs 전체가구 자산 지표</text>

  <!-- legend -->
  <rect x="952" y="30" width="16" height="16" rx="3" fill="#E8734A"/>
  <text class="ko legend" x="976" y="44">청년가구</text>
  <rect x="1052" y="30" width="16" height="16" rx="3" fill="#9AA5B1"/>
  <text class="ko legend" x="1076" y="44">전체가구</text>

  <!-- ================= panel 1 ================= -->
  <rect x="40" y="72" width="360" height="316" rx="10" fill="#F2F5F9"/>
  <text class="ko panel-title" x="66" y="106">평균 자산</text>
  <text class="ko note" x="66" y="128">단위: 만 원</text>
  <line x1="66" y1="344" x2="374" y2="344" stroke="#C7CFD8" stroke-width="2"/>

  <!-- 전체 566.78백만 = 56,678만 -> height 190 ; 청년 31,498만 -> 190*0.5557=105.6 -->
  <rect x="120" y="238" width="86" height="106" rx="4" fill="#E8734A"/>
  <text class="ko value-hi" x="163" y="228" text-anchor="middle">31,498</text>
  <text class="ko axis" x="163" y="366" text-anchor="middle">청년가구</text>

  <rect x="248" y="154" width="86" height="190" rx="4" fill="#9AA5B1"/>
  <text class="ko value" x="291" y="144" text-anchor="middle">56,678</text>
  <text class="ko axis" x="291" y="366" text-anchor="middle">전체가구</text>

  <!-- 55.6% callout -->
  <rect x="104" y="264" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.5"/>
  <text class="ko" x="163" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#C4501F">전체의 55.6%</text>

  <!-- ================= panel 2 ================= -->
  <rect x="420" y="72" width="360" height="316" rx="10" fill="#F2F5F9"/>
  <text class="ko panel-title" x="446" y="106">자산 대비 부채비율</text>
  <text class="ko note" x="446" y="128">단위: %</text>
  <line x1="446" y1="344" x2="754" y2="344" stroke="#C7CFD8" stroke-width="2"/>

  <!-- 30.3% -> 190 ; 16.8% -> 105 -->
  <rect x="500" y="154" width="86" height="190" rx="4" fill="#E8734A"/>
  <text class="ko value-hi" x="543" y="144" text-anchor="middle">30.3%</text>
  <text class="ko axis" x="543" y="366" text-anchor="middle">청년가구</text>

  <rect x="628" y="239" width="86" height="105" rx="4" fill="#9AA5B1"/>
  <text class="ko value" x="671" y="229" text-anchor="middle">16.8%</text>
  <text class="ko axis" x="671" y="366" text-anchor="middle">전체가구</text>

  <rect x="484" y="184" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#E8734A" stroke-width="1.5"/>
  <text class="ko" x="543" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#C4501F">전체의 1.8배</text>

  <!-- ================= panel 3 ================= -->
  <rect x="800" y="72" width="360" height="316" rx="10" fill="#F2F5F9"/>

  <text class="ko panel-title" x="826" y="106">저축액 대비 금융부채비율</text>
  <text class="ko note" x="826" y="128">단위: %</text>

  <line x1="826" y1="344" x2="1134" y2="344"
        stroke="#C7CFD8" stroke-width="2"/>

  <!-- 100% 기준 -->
  <rect x="850" y="199" width="86" height="145"
        rx="4" fill="#9AA5B1"/>

  <text class="ko value"
        x="893" y="189"
        text-anchor="middle">100%</text>

  <text class="ko axis"
        x="893" y="366"
        text-anchor="middle">저축액 기준</text>

  <!-- 청년가구 131.1% -->
  <rect x="1010" y="154" width="86" height="190"
        rx="4" fill="#E8734A"/>

  <text class="ko value-hi"
        x="1053" y="144"
        text-anchor="middle">131.1%</text>

  <text class="ko axis"
        x="1053" y="366"
        text-anchor="middle">청년가구</text>

  <!-- 차이 -->
  <text class="ko"
        x="974" y="245"
        text-anchor="middle"
        font-size="14"
        font-weight="700"
        fill="#C4501F">+31.1%p</text>

  <text class="ko note"
        x="974" y="269"
        text-anchor="middle">저축액보다 금융부채가 많음</text>

  <!-- caption -->
  <text class="ko cap" x="40" y="426">자료: 2025년 가계금융복지조사(국가데이터처·한국은행·금융감독원), 2025년 3월 말 기준 · 가구주 연령 39세 이하</text>
  <text class="ko cap" x="40" y="450">※ 저축액 대비 금융부채비율은 전체가구 대응값을 함께 제시하지 않고 100% 기준선으로 비교</text>
</svg>
