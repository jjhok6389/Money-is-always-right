<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" role="img" aria-label="재무 진단, 목표 Gap, What-if 시뮬레이션, 대화형 코칭으로 이어지는 순환 사이클">
  <style>
    .ko { font-family: 'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #1E3A5F; }
    .sub { font-size: 15px; fill: #6B7684; }
    .node-t { font-size: 21px; font-weight: 700; fill: #1E3A5F; }
    .node-d { font-size: 14px; fill: #444C56; }
    .core { font-size: 24px; font-weight: 700; fill: #FFFFFF; }
    .core-s { font-size: 14px; fill: #A9BDD4; }
    .step { font-size: 13px; font-weight: 700; fill: #2E7DD1; }
  </style>

  <rect x="0" y="0" width="1000" height="660" fill="#FFFFFF"/>

  <text class="ko title" x="40" y="46">핵심 컨셉 — 하나의 사이클로 연결되는 AI 금융 코치</text>
  <text class="ko sub" x="40" y="72">상품 나열이 아니라, 진단에서 코칭까지 돌아가는 순환 구조</text>

  <defs>
    <marker id="cyc" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2E7DD1"/>
    </marker>
  </defs>

  <!-- cycle arrows (clockwise) -->
  <path d="M 556.4,214.9 A 165,165 0 0 1 655.1,313.6" fill="none" stroke="#2E7DD1" stroke-width="4" marker-end="url(#cyc)"/>
  <path d="M 655.1,426.4 A 165,165 0 0 1 556.4,525.1" fill="none" stroke="#2E7DD1" stroke-width="4" marker-end="url(#cyc)"/>
  <path d="M 443.6,525.1 A 165,165 0 0 1 344.9,426.4" fill="none" stroke="#2E7DD1" stroke-width="4" marker-end="url(#cyc)"/>
  <path d="M 344.9,313.6 A 165,165 0 0 1 443.6,214.9" fill="none" stroke="#2E7DD1" stroke-width="4" marker-end="url(#cyc)"/>

  <!-- center -->
  <circle cx="500" cy="370" r="96" fill="#1E3A5F"/>
  <text class="ko core" x="500" y="358" text-anchor="middle">AI 금융 코치</text>
  <text class="ko core-s" x="500" y="388" text-anchor="middle">수치 = 계산 Tool</text>
  <text class="ko core-s" x="500" y="410" text-anchor="middle">설명 = RAG 문서 근거</text>

  <!-- top node -->
  <rect x="340" y="112" width="320" height="96" rx="12" fill="#F2F5F9" stroke="#D7DFE8" stroke-width="1.5"/>
  <text class="ko step" x="364" y="140">STEP 1</text>
  <text class="ko node-t" x="364" y="168">재무 진단</text>
  <text class="ko node-d" x="364" y="192">소득·지출·자산·부채 현황과 소비 구조 분석</text>

  <!-- right node -->
  <rect x="676" y="322" width="300" height="96" rx="12" fill="#F2F5F9" stroke="#D7DFE8" stroke-width="1.5"/>
  <text class="ko step" x="700" y="350">STEP 2</text>
  <text class="ko node-t" x="700" y="378">목표 Gap</text>
  <text class="ko node-d" x="700" y="402">부족액·달성률·달성 예상 시점 산출</text>

  <!-- bottom node -->
  <rect x="340" y="532" width="320" height="96" rx="12" fill="#F2F5F9" stroke="#D7DFE8" stroke-width="1.5"/>
  <text class="ko step" x="364" y="560">STEP 3</text>
  <text class="ko node-t" x="364" y="588">What-if 시뮬레이션</text>
  <text class="ko node-d" x="364" y="612">디지털 트윈으로 행동 변경 결과 비교</text>

  <!-- left node -->
  <rect x="24" y="322" width="300" height="96" rx="12" fill="#F2F5F9" stroke="#D7DFE8" stroke-width="1.5"/>
  <text class="ko step" x="48" y="350">STEP 4</text>
  <text class="ko node-t" x="48" y="378">대화형 코칭</text>
  <text class="ko node-d" x="48" y="402">챗봇 상담·코칭 리포트로 행동 제안</text>
</svg>
