<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="서비스 한 장 요약 - 온보딩부터 코칭 리포트까지의 처리 흐름">
  <style>
    .ko { font-family: 'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #1E3A5F; }
    .sub { font-size: 15px; fill: #6B7684; }
    .step-no { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .step-title { font-size: 20px; font-weight: 700; fill: #1E3A5F; }
    .step-desc { font-size: 14px; fill: #444C56; }
    .route { font-size: 13px; fill: #2E7DD1; font-weight: 700; }
    .band-title { font-size: 15px; font-weight: 700; fill: #1E3A5F; }
    .badge { font-size: 14px; fill: #1E3A5F; }
  </style>

  <rect x="0" y="0" width="1200" height="440" fill="#FFFFFF"/>

  <text class="ko title" x="40" y="46">Money₩aker — 청년 맞춤형 AI 자산 형성 플랫폼</text>
  <text class="ko sub" x="40" y="72">개인 재무 데이터 입력부터 행동 코칭까지 하나의 흐름으로 연결</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2E7DD1"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="40" y="98" width="256" height="176" rx="12" fill="#F2F5F9" stroke="#D7DFE8" stroke-width="1.5"/>
  <circle cx="70" cy="128" r="15" fill="#1E3A5F"/>
  <text class="ko step-no" x="70" y="133" text-anchor="middle">1</text>
  <text class="ko step-title" x="96" y="134">데이터 수집</text>
  <text class="ko step-desc" x="64" y="170">· 소득·고정비·투자성향·목표</text>
  <text class="ko step-desc" x="64" y="194">· 마이데이터 형식 소비 거래</text>
  <text class="ko step-desc" x="64" y="218">· 카테고리·고정/변동 분류</text>
  <text class="ko route" x="64" y="250">/onboarding · /transactions</text>

  <line x1="300" y1="186" x2="330" y2="186" stroke="#2E7DD1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <rect x="342" y="98" width="256" height="176" rx="12" fill="#F2F5F9" stroke="#D7DFE8" stroke-width="1.5"/>
  <circle cx="372" cy="128" r="15" fill="#1E3A5F"/>
  <text class="ko step-no" x="372" y="133" text-anchor="middle">2</text>
  <text class="ko step-title" x="398" y="134">재무 진단 · 목표 Gap</text>
  <text class="ko step-desc" x="366" y="170">· 자산 포트폴리오·소비 분석</text>
  <text class="ko step-desc" x="366" y="194">· 부족액·달성률·달성 예상 시점</text>
  <text class="ko step-desc" x="366" y="218">· 저축 여력 및 실행 로드맵</text>
  <text class="ko route" x="366" y="250">/dashboard</text>

  <line x1="602" y1="186" x2="632" y2="186" stroke="#2E7DD1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <rect x="644" y="98" width="256" height="176" rx="12" fill="#F2F5F9" stroke="#D7DFE8" stroke-width="1.5"/>
  <circle cx="674" cy="128" r="15" fill="#1E3A5F"/>
  <text class="ko step-no" x="674" y="133" text-anchor="middle">3</text>
  <text class="ko step-title" x="700" y="134">What-if 시뮬레이션</text>
  <text class="ko step-desc" x="668" y="170">· 재무 디지털 트윈 구축</text>
  <text class="ko step-desc" x="668" y="194">· 지출·저축률·수익률 변경</text>
  <text class="ko step-desc" x="668" y="218">· 기준 계획 대비 궤적 비교</text>
  <text class="ko route" x="668" y="250">/simulation</text>

  <line x1="904" y1="186" x2="934" y2="186" stroke="#2E7DD1" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <rect x="946" y="98" width="214" height="176" rx="12" fill="#E8F1FB" stroke="#2E7DD1" stroke-width="2"/>
  <circle cx="976" cy="128" r="15" fill="#2E7DD1"/>
  <text class="ko step-no" x="976" y="133" text-anchor="middle">4</text>
  <text class="ko step-title" x="1002" y="134">AI 금융 코치</text>
  <text class="ko step-desc" x="970" y="170">· 도구 호출형 대화 상담</text>
  <text class="ko step-desc" x="970" y="194">· 실행 트레이스 공개</text>
  <text class="ko step-desc" x="970" y="218">· 장면형 코칭 리포트</text>
  <text class="ko route" x="970" y="250">챗봇 · /reports</text>

  <!-- data band -->
  <rect x="40" y="300" width="1120" height="92" rx="12" fill="#1E3A5F"/>
  <text class="ko band-title" x="72" y="332" fill="#FFFFFF">활용 데이터</text>
  <text class="ko" x="72" y="366" font-size="13" fill="#A9BDD4">수치는 도구 조회·계산, 설명은 문서 근거</text>

  <rect x="316" y="322" width="252" height="48" rx="24" fill="#FFFFFF"/>
  <text class="ko badge" x="442" y="352" text-anchor="middle">금감원 「금융상품 한눈에」 공시</text>

  <rect x="588" y="322" width="252" height="48" rx="24" fill="#FFFFFF"/>
  <text class="ko badge" x="714" y="352" text-anchor="middle">KRX ETF 일별 시계열</text>

  <rect x="860" y="322" width="272" height="48" rx="24" fill="#FFFFFF"/>
  <text class="ko badge" x="996" y="352" text-anchor="middle">RAG 지식 문서 · 정책금융</text>
</svg>
